version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - goheader
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - unconvert
    - revive
  settings:
    revive:
      rules:
        # Every package says what it is for and every exported identifier
        # carries a doc comment. Stuttering names are left alone: renaming
        # them would break the lanes that build against core.
        - name: package-comments
        - name: exported
          arguments: [disableStutteringCheck]
    goheader:
      values:
        regexp:
          YEARS: '20\d\d(-20\d\d)?'
      template: |-
        Copyright (c) {{ YEARS }} Rhythm Shahriar <me@rhy.io>
        SPDX-License-Identifier: MIT
    depguard:
      rules:
        # Sightread never runs fetched code. The few programs it does start
        # (git, the user's wp command, rhythm-soundcheck, rhythm-roadie)
        # go through internal/proc, which takes an argv and never a shell.
        # Tests may start the binary they build.
        no-exec:
          files:
            - $all
            - "!$test"
            - "!**/internal/proc/**"
          deny:
            - pkg: os/exec
              desc: start programs through internal/proc (argv only, output capped, Purpose logged)
            - pkg: plugin
              desc: Sightread loads no code at run time
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: InsecureSkipVerify
          msg: TLS is always verified (SR-4)
        - pattern: ^net\.(Lookup.*|Resolver|DefaultResolver)$
          msg: no DNS lookups of package domains; only stage/ resolves the hosts the user named
    errcheck:
      exclude-functions: # terminal output; nothing useful to do if stdout is gone
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
      # User-facing copy and comments use British English.
      ignore-rules:
        - analyse
        - analysed
        - analyses
        - analysing
        - unanalysed
        - sanitise
        - sanitised
        - sanitises
        - sanitising
        - normalise
        - normalised
        - normalises
        - recognise
        - recognised
        - summarise
        - summarised
        - neutralise
        - neutralised
        - authorise
        - authorised
        - behaviour
        - behaviours
        - colour
        - colours
        - catalogue
        - dialling
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, revive]
      # stage/ checks that --soundcheck targets staging, not production,
      # by resolving the two hosts the user named.
      - path: ^stage/
        linters: [forbidigo]
        text: no DNS lookups
formatters:
  enable: [gofmt]
