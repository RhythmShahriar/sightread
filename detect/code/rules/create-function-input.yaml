# Derived from tuner/local/rules/local-malware-create-function-input.yaml
id: create-function-input
name: create_function() built from request input
signal: eval-dynamic
side: added
files: ["**/*.php", "**/*.phtml", "**/*.inc"]
exclude: ["vendor/**"]
match:
  regex: ['(?i)\bcreate_function\s*\([^;]{0,200}\$_(?:POST|GET|REQUEST|COOKIE)\b']
