# Explain text of local-drift (rhythm-sightread explain local-drift).
why: >-
  The installed copy differs from the official copy of the installed
  version. Someone may have edited files on the server, or something
  else changed them. Updating will overwrite them.
how_to_review:
  - "Compare the files in the finding with the official copy."
  - "Decide whether the changes are edits you made."
  - "Keep a copy of edits you want before updating."
false_alarms: >-
  Changes to readme.txt, .po, .mo and .pot files and JSON translations
  under languages/ are not counted. PHP translation files (.l10n.php)
  are: PHP runs them.
incidents: []
advice: "Updating will overwrite these files. Keep a copy of edits you want."
more: https://github.com/RhythmShahriar/rhythm/wiki/Sightread-Signal-Reference#local-drift
