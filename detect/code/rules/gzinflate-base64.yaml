# Derived from tuner/local/rules/local-malware-gzinflate-base64.yaml
id: gzinflate-base64
name: Compressed and base64-encoded code
signal: decode-exec
side: added
# Packed code that is not run on the same line is high, as in Tuner:
# the Go detector reports the run itself as critical.
severity: high
files: ["**/*.php", "**/*.phtml", "**/*.inc"]
exclude: ["vendor/**"]
match:
  regex: ['(?i)\b(?:gzinflate|gzuncompress|gzdecode)\s*\(\s*@?\s*base64_decode\s*\(']
