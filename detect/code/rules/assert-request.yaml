# Derived from tuner/local/rules/local-malware-assert-request.yaml
id: assert-request
name: assert() runs request input
signal: eval-dynamic
side: added
files: ["**/*.php", "**/*.phtml", "**/*.inc"]
exclude: ["vendor/**"]
match:
  regex: ['(?i)\bassert\s*\(\s*@?\s*(?:stripslashes\s*\(\s*)?\$_(?:POST|GET|REQUEST|COOKIE|SERVER)\b']
