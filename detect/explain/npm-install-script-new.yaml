# Explain text of npm-install-script-new (rhythm-sightread explain npm-install-script-new).
why: >-
  The package adds or changes a preinstall, install, postinstall or
  prepare script, or a binding.gyp that makes npm build on install.
  These scripts run on every machine that installs the package, CI
  included, before anyone reads the code. Sightread reads the script and
  the files it calls.
how_to_review:
  - "Read the script in the finding and the files it runs."
  - "Install with --ignore-scripts until it is reviewed."
  - "Check that the repository has the same script."
false_alarms: >-
  An unchanged node-gyp install and a prepare that only runs husky or
  build tools the package already used do not fire.
incidents:
  - name: "axios 2026"
    line: "The new dependency plain-crypto-js dropped a remote access tool from its postinstall script."
  - name: "Shai-Hulud"
    line: "Every republished package carried a new install script."
advice: "Install with --ignore-scripts until someone has read the script."
more: https://github.com/RhythmShahriar/rhythm/wiki/Sightread-Signal-Reference#npm-install-script-new
