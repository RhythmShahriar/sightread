# Explain text of credential-access (rhythm-sightread explain credential-access).
why: >-
  New code reads credential files (.npmrc, .ssh, .aws, auth.json,
  wp-config.php constants) or token variables (NPM_TOKEN, GITHUB_TOKEN,
  AWS_*, *_SECRET). A stolen token lets someone publish or deploy as
  you.
how_to_review:
  - "Read what is read and where it goes next."
  - "Check whether the package documents needing it."
  - "If it runs at install time, treat CI tokens as exposed."
false_alarms: >-
  Reading process.env.NODE_ENV and settings the package documents does
  not fire.
incidents:
  - name: "Shai-Hulud"
    line: "Install scripts read npm and GitHub tokens and published the owners' other packages with them."
  - name: "phpass 2022"
    line: "The hijacked release sent AWS keys from the environment."
advice: "Hold the update. Rotate tokens on any machine that already ran it."
more: https://github.com/RhythmShahriar/rhythm/wiki/Sightread-Signal-Reference#credential-access
