# Keeps the pinned dependencies current: the actions pinned by commit in
# action.yml and the workflows and the Go modules. Updates are grouped per
# ecosystem and use a Conventional Commits prefix, so commitlint passes
# them. The owner never merges a Dependabot pull request: each update is
# applied again as an own commit, so the bot stays off the contributor
# list.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      go:
        patterns: ["*"]
