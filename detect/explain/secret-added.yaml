# Explain text of secret-added (rhythm-sightread explain secret-added).
why: >-
  An added line holds something shaped like a credential: an API key, a
  token or a private key. Shipping it exposes it to everyone who
  installs the package. Sightread shows it masked.
how_to_review:
  - "Check whether the key looks real."
  - "Tell the maintainers so they rotate it."
  - "Never use it yourself."
false_alarms: >-
  Keys in tests and fixtures folders and documented examples (EXAMPLE,
  xxxx) are info.
incidents: []
advice: "Tell the maintainers. A published key must be rotated."
more: https://github.com/RhythmShahriar/rhythm/wiki/Sightread-Signal-Reference#secret-added
