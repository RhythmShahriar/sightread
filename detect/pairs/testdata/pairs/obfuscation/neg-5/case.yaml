old:
  inc/page-0.php: |
    <?php
    /**
     * Settings screen of the plugin.
     */
    function acme_settings_page_0() {
        if ( ! current_user_can( 'manage_options' ) ) {
            return;
        }
        $options = get_option( 'acme_options', array() );
        echo '<div class="wrap"><h1>' . esc_html__( 'Settings', 'acme' ) . '</h1>';
        foreach ( $options as $key => $value ) {
            printf( '<p>%s: %s</p>', esc_html( $key ), esc_html( $value ) );
        }
        echo '</div>';
    }

    /**
     * Saves the settings form.
     */
    function acme_save_settings_0() {
        check_admin_referer( 'acme_save' );
        update_option( 'acme_options', array_map( 'sanitize_text_field', wp_unslash( $_POST['acme'] ) ) );
    }
