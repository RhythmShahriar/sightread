# Explain text of typosquat (rhythm-sightread explain typosquat).
why: >-
  A new dependency is named like a popular package with a letter
  swapped, a separator changed, a scope confused, a look-alike character
  or a word like "plain" or "official" added. Such names count on nobody
  reading them closely.
how_to_review:
  - "Compare the name with the popular one in the evidence."
  - "Check who publishes it and when it first appeared."
  - "Ask why the package needs it."
false_alarms: >-
  Names that are popular themselves (preact, react-dom, lodash.merge,
  colors next to color) do not fire, nor do names under the popular
  package's own npm scope or Composer vendor, which only its owner can
  publish to.
incidents:
  - name: "axios 2026"
    line: "plain-crypto-js, named like crypto-js, was published hours before axios added it."
advice: "Check the dependency's name letter by letter."
more: https://github.com/RhythmShahriar/rhythm/wiki/Sightread-Signal-Reference#typosquat
