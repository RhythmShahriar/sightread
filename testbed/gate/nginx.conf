# The testbed's gate: the only container on both networks. It forwards
# 127.0.0.1:18907 to WordPress on the sealed network and nothing else;
# nothing on the sealed network has a route out through it.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 256;
}

http {
	access_log off;
	client_max_body_size 64m;
	resolver 127.0.0.11 valid=10s ipv6=off;
	proxy_http_version 1.1;
	proxy_read_timeout 120s;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header Connection "";

	server {
		listen 18907;
		location / {
			set $up http://wp:80;
			proxy_pass $up;
		}
	}

	# The health check's own port, so it never depends on WordPress.
	server {
		listen 127.0.0.1:18899;
		location / {
			return 204;
		}
	}
}
